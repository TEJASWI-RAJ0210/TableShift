<svg viewBox="0 0 520 390" xmlns="http://www.w3.org/2000/svg" width="520" height="390">
  <defs>
    <clipPath id="frame-clip">
      <rect x="0" y="0" width="500" height="360" rx="12"/>
    </clipPath>
  </defs>

  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="500" height="360" rx="12" fill="#1a1916" stroke="#44413a" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="500" height="40" rx="12" fill="#232220" clip-path="url(#frame-clip)"/>
    <rect x="0" y="28" width="500" height="12" fill="#232220"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="20" r="6" fill="#febc2e"/>
    <circle cx="56" cy="20" r="6" fill="#28c840"/>

    <!-- Tab label -->
    <text x="250" y="25" font-family="monospace" font-size="12" fill="#847f73" text-anchor="middle">tableshift — csv-to-sql</text>

    <!-- Divider -->
    <line x1="0" y1="40" x2="500" y2="40" stroke="#34322d" stroke-width="1"/>

    <!-- Prompt -->
    <text x="20" y="68" font-family="monospace" font-size="12" fill="#52b788">$</text>
    <text x="32" y="68" font-family="monospace" font-size="12" fill="#b8b3a8">tableshift convert users.csv --dialect mysql</text>

    <!-- Comment -->
    <text x="20" y="96" font-family="monospace" font-size="11" fill="#847f73">-- Generated by TableShift</text>

    <!-- CREATE TABLE -->
    <text x="20" y="120" font-family="monospace" font-size="12" fill="#7fa8d9">CREATE TABLE</text>
    <text x="128" y="120" font-family="monospace" font-size="12" fill="#e0a857"> `users`</text>
    <text x="184" y="120" font-family="monospace" font-size="12" fill="#f2f0ea"> (</text>

    <!-- id -->
    <text x="36" y="142" font-family="monospace" font-size="12" fill="#e0a857">`id`</text>
    <text x="68" y="142" font-family="monospace" font-size="12" fill="#7fa8d9"> INT</text>
    <text x="96" y="142" font-family="monospace" font-size="12" fill="#52b788"> NOT NULL</text>
    <text x="164" y="142" font-family="monospace" font-size="12" fill="#f2f0ea">,</text>

    <!-- name -->
    <text x="36" y="162" font-family="monospace" font-size="12" fill="#e0a857">`name`</text>
    <text x="84" y="162" font-family="monospace" font-size="12" fill="#7fa8d9"> VARCHAR</text>
    <text x="152" y="162" font-family="monospace" font-size="12" fill="#f2f0ea">(64)</text>
    <text x="184" y="162" font-family="monospace" font-size="12" fill="#52b788"> NOT NULL</text>
    <text x="252" y="162" font-family="monospace" font-size="12" fill="#f2f0ea">,</text>

    <!-- email -->
    <text x="36" y="182" font-family="monospace" font-size="12" fill="#e0a857">`email`</text>
    <text x="90" y="182" font-family="monospace" font-size="12" fill="#7fa8d9"> VARCHAR</text>
    <text x="158" y="182" font-family="monospace" font-size="12" fill="#f2f0ea">(128)</text>
    <text x="198" y="182" font-family="monospace" font-size="12" fill="#f2f0ea">,</text>

    <!-- signup_date -->
    <text x="36" y="202" font-family="monospace" font-size="12" fill="#e0a857">`signup_date`</text>
    <text x="132" y="202" font-family="monospace" font-size="12" fill="#7fa8d9"> DATE</text>
    <text x="168" y="202" font-family="monospace" font-size="12" fill="#52b788"> NOT NULL</text>
    <text x="236" y="202" font-family="monospace" font-size="12" fill="#f2f0ea">,</text>

    <!-- is_active -->
    <text x="36" y="222" font-family="monospace" font-size="12" fill="#e0a857">`is_active`</text>
    <text x="120" y="222" font-family="monospace" font-size="12" fill="#7fa8d9"> TINYINT</text>
    <text x="186" y="222" font-family="monospace" font-size="12" fill="#f2f0ea">(1)</text>
    <text x="208" y="222" font-family="monospace" font-size="12" fill="#52b788"> NOT NULL</text>

    <!-- Closing -->
    <text x="20" y="242" font-family="monospace" font-size="12" fill="#f2f0ea">);</text>

    <!-- Separator -->
    <line x1="20" y1="258" x2="480" y2="258" stroke="#34322d" stroke-width="1"/>

    <!-- INSERT INTO -->
    <text x="20" y="278" font-family="monospace" font-size="12" fill="#7fa8d9">INSERT INTO</text>
    <text x="116" y="278" font-family="monospace" font-size="12" fill="#e0a857"> `users`</text>
    <text x="168" y="278" font-family="monospace" font-size="12" fill="#f2f0ea"> VALUES</text>

    <!-- Values row — Tejaswi, 02-10-2005 -->
    <text x="20" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">(</text>
    <text x="28" y="298" font-family="monospace" font-size="12" fill="#9fc9a2">1</text>
    <text x="36" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">, </text>
    <text x="50" y="298" font-family="monospace" font-size="12" fill="#ef9f27">'Tejaswi'</text>
    <text x="122" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">, </text>
    <text x="134" y="298" font-family="monospace" font-size="12" fill="#ef9f27">'tejaswi@ex.com'</text>
    <text x="242" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">, </text>
    <text x="254" y="298" font-family="monospace" font-size="12" fill="#ef9f27">'02-10-2005'</text>
    <text x="344" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">, </text>
    <text x="356" y="298" font-family="monospace" font-size="12" fill="#9fc9a2">1</text>
    <text x="364" y="298" font-family="monospace" font-size="12" fill="#f2f0ea">);</text>

    <!-- Cursor -->
    <text x="20" y="330" font-family="monospace" font-size="12" fill="#52b788">$</text>
    <rect x="32" y="316" width="8" height="16" fill="#52b788" opacity="0.8"/>
  </g>
</svg>